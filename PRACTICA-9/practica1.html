<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 1 - Introducción / instalar Bootstrap</title>

    <!--
      PRÁCTICA 1 - Ejercicio 1
      Importar Bootstrap en el proyecto, llamándolo de manera remota (CDN).
      Para usarlo localmente: descargar bootstrap.min.css y bootstrap.bundle.min.js
      desde getbootstrap.com y cambiar las rutas de abajo por las de los archivos.
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PRÁCTICA 1 - Ejercicio 3: archivo estilo.css llamado desde este documento -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!--
      PRÁCTICA 1 - Ejercicios 2 y 3
      Div de clase "container" con una fila (row) que contiene 1 columna (col).
      Además se le agrega la clase "contenedor" (definida en estilo.css, con
      color de fondo) al div container.
    -->
    <div class="container contenedor">
        <div class="row">
            <div class="col">
                Una fila con una columna dentro de un container.
            </div>
        </div>
    </div>

    <!-- PRÁCTICA 1 - Ejercicio 1: JavaScript de Bootstrap (necesario para modal, slider, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
