<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 2 - Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!--
      PRÁCTICA 2 - Ejercicio 1: sistema de grilla
      - Resoluciones mayores a sm: 1ª fila con una columna al 100% y 2ª fila
        con 2 columnas al 50% cada una.
      - Resoluciones sm o menores: 3 filas, cada una con 1 columna al 100%.

      Se resuelve con: col-12 (100% en pantallas chicas) y col-md-6 (50% desde
      el breakpoint md en adelante, o sea, a partir de 768px). Como en
      pantallas chicas las dos columnas de la 2ª fila ocupan 12 de 12, Bootstrap
      las apila y quedan las 3 filas pedidas.
    -->
    <div class="container">

        <!-- Fila 1: una columna que ocupa el 100% del ancho -->
        <div class="row">
            <div class="col-12">
                <div class="caja violeta"></div>
            </div>
        </div>

        <!-- Fila 2: 2 columnas del 50% (en sm y menores pasan a 100% cada una) -->
        <div class="row">
            <div class="col-12 col-md-6">
                <div class="caja crema"></div>
            </div>
            <div class="col-12 col-md-6">
                <div class="caja rosa"></div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
