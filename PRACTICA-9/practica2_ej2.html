<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 2 - Ejercicio 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!--
      PRÁCTICA 2 - Ejercicio 2: estructura básica de un sitio web con la grilla.

      Diseño grande (md en adelante):
        - Encabezado violeta al 100%.
        - Sidebar durazno a la izquierda (3 de 12 columnas).
        - A la derecha (9 de 12): rectángulo verde al 100%, 6 rectángulos
          grises (3 por fila) y abajo 2 rectángulos celestes (uno chico y uno
          grande).

      Diseño sm (y menores):
        - Todo apilado: encabezado, sidebar, verde, grises de a 2 por fila y
          celestes de a 2 por fila (50% cada uno).

      Nota sobre los tamaños: el enunciado dice que la barra lateral y los 6
      rectángulos del centro tienen tamaño 3, y el celeste grande tamaño 6.
      Eso se mide sobre el área central (que son 9 "unidades"): 3 + 3 + 3 = 9
      y el celeste 3 + 6 = 9. Al anidar un row dentro de la columna col-md-9,
      Bootstrap vuelve a dividir ese ancho en 12, por eso esas medidas se
      escriben como col-md-4 (3 de 9) y col-md-8 (6 de 9). El resultado visual
      es el del ejemplo.
    -->
    <div class="container">

        <!-- Encabezado violeta -->
        <div class="row">
            <div class="col-12">
                <div class="caja violeta"></div>
            </div>
        </div>

        <div class="row">

            <!-- Sidebar (tamaño 3): en sm pasa a ocupar todo el ancho -->
            <div class="col-12 col-md-3">
                <div class="caja durazno" style="min-height: 100px;"></div>
            </div>

            <!-- Contenido central (tamaño 9) -->
            <div class="col-12 col-md-9">
                <div class="row">

                    <!-- Rectángulo verde al 100% -->
                    <div class="col-12">
                        <div class="caja verde"></div>
                    </div>

                    <!-- 6 rectángulos grises: 3 por fila en grande, 2 por fila en sm -->
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>
                    <div class="col-6 col-md-4"><div class="caja gris"></div></div>

                    <!-- Rectángulos celestes: chico (3) y grande (6) en grande, 50% y 50% en sm -->
                    <div class="col-6 col-md-4">
                        <div class="caja celeste" style="min-height: 150px;"></div>
                    </div>
                    <div class="col-6 col-md-8">
                        <div class="caja celeste" style="min-height: 150px;"></div>
                    </div>

                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
